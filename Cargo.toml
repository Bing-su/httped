[package]
name = "httped"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytes = "1"
data-encoding = "2"
regex = "1"
rust-embed = "8"
salvo = {
  version = "0.93",
  features = [
    "anyhow",
    "basic-auth",
    "compression",
    "logging",
    "oapi",
    "serve-static",
    "trailing-slash",
  ]
}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
